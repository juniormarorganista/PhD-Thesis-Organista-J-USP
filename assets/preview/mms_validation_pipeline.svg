<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">MMS validation pipeline</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="45" y="105" rx="18" ry="18" width="190" height="120" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="140" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Manufactured</text>
    <text x="140" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">solution</text>
    <text x="140" y="202" text-anchor="middle" font-size="14" fill="#1e40af">qₑ(x,y,t)</text>

    <rect x="285" y="105" rx="18" ry="18" width="190" height="120" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="380" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Substitution</text>
    <text x="380" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">in PDEs</text>
    <text x="380" y="202" text-anchor="middle" font-size="14" fill="#166534">L(qₑ)</text>

    <rect x="525" y="105" rx="18" ry="18" width="190" height="120" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="620" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Source terms</text>
    <text x="620" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">generated</text>
    <text x="620" y="202" text-anchor="middle" font-size="14" fill="#92400e">fₘₘₛ</text>

    <rect x="765" y="105" rx="18" ry="18" width="190" height="120" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="860" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Numerical</text>
    <text x="860" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">solver</text>
    <text x="860" y="202" text-anchor="middle" font-size="14" fill="#5b21b6">qₕ</text>

    <rect x="1005" y="105" rx="18" ry="18" width="150" height="120" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="1080" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Error and</text>
    <text x="1080" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">order</text>
    <text x="1080" y="202" text-anchor="middle" font-size="14" fill="#991b1b">p ≈ expected</text>

    <line x1="240" y1="165" x2="278" y2="165" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="480" y1="165" x2="518" y2="165" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="720" y1="165" x2="758" y2="165" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="960" y1="165" x2="998" y2="165" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Manufactured solution → source terms → numerical approximation → convergence verification</text>
</svg>
