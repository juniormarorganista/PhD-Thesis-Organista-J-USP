<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <defs>
    <style>
      .folder{fill:#fff8e6;stroke:#b7791f;stroke-width:2;rx:12;ry:12}
      .new{fill:#e8fff1;stroke:#2f855a;stroke-width:2;rx:12;ry:12}
      .orig{fill:#f7fbff;stroke:#2b6cb0;stroke-width:2;rx:12;ry:12}
      .title{font-family:Arial, sans-serif;font-size:22px;font-weight:700;fill:#1a202c}
      .txt{font-family:Arial, sans-serif;font-size:15px;fill:#1a202c}
      .small{font-family:Arial, sans-serif;font-size:13px;fill:#1a202c}
    </style>
  </defs>
  <text x="40" y="42" class="title">Estrutura científica do repositório</text>

  <rect x="40" y="80" width="230" height="130" class="orig"/>
  <text x="65" y="115" class="title" font-size="18">src/fortran_original</text>
  <text x="65" y="145" class="txt">Código Fortran preservado</text>
  <text x="65" y="170" class="small">referência científica</text>

  <rect x="310" y="80" width="230" height="130" class="orig"/>
  <text x="335" y="115" class="title" font-size="18">thesis/original</text>
  <text x="335" y="145" class="txt">LaTeX original da tese</text>
  <text x="335" y="170" class="small">não alterar conteúdo</text>

  <rect x="580" y="80" width="230" height="130" class="orig"/>
  <text x="605" y="115" class="title" font-size="18">mathematica_original</text>
  <text x="605" y="145" class="txt">Notebooks simbólicos</text>
  <text x="605" y="170" class="small">termos fonte MMS</text>

  <rect x="850" y="80" width="210" height="130" class="orig"/>
  <text x="875" y="115" class="title" font-size="18">papers/original</text>
  <text x="875" y="145" class="txt">Materiais de artigos</text>
  <text x="875" y="170" class="small">figuras e fontes</text>

  <rect x="40" y="260" width="300" height="130" class="new"/>
  <text x="65" y="295" class="title" font-size="18">src/mms_viscoelastic</text>
  <text x="65" y="325" class="txt">Biblioteca Python</text>
  <text x="65" y="350" class="small">MMS, erros, visualização, ML</text>

  <rect x="400" y="260" width="300" height="130" class="folder"/>
  <text x="425" y="295" class="title" font-size="18">docs/ e README.md</text>
  <text x="425" y="325" class="txt">Explicação científica</text>
  <text x="425" y="350" class="small">GitHub, tese e reprodutibilidade</text>

  <rect x="760" y="260" width="300" height="130" class="folder"/>
  <text x="785" y="295" class="title" font-size="18">assets/preview</text>
  <text x="785" y="325" class="txt">Imagens do README</text>
  <text x="785" y="350" class="small">diagramas e resultados gerados</text>
</svg>
