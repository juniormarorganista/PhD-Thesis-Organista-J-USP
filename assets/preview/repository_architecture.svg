<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Repository architecture</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="60" y="90" width="300" height="350" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="210" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#075985">Original material</text>
    <text x="90" y="175" fill="#0c4a6e">src/fortran_original/</text>
    <text x="90" y="215" fill="#0c4a6e">src/mathematica_original/</text>
    <text x="90" y="255" fill="#0c4a6e">thesis/original/</text>
    <text x="90" y="295" fill="#0c4a6e">papers/original/</text>
    <text x="90" y="360" fill="#075985" font-size="15">Preserved reference sources</text>

    <rect x="450" y="90" width="300" height="350" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">Python package</text>
    <text x="480" y="175" fill="#166534">mms_viscoelastic/grids.py</text>
    <text x="480" y="215" fill="#166534">manufactured_solutions/</text>
    <text x="480" y="255" fill="#166534">source_terms/</text>
    <text x="480" y="295" fill="#166534">validation/</text>
    <text x="480" y="335" fill="#166534">ml/ and visualization/</text>
    <text x="480" y="390" fill="#14532d" font-size="15">Modern reproducible layer</text>

    <rect x="840" y="90" width="300" height="350" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="990" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">Validation and docs</text>
    <text x="870" y="175" fill="#92400e">validation/reference_data/</text>
    <text x="870" y="215" fill="#92400e">validation/fortran_reference/</text>
    <text x="870" y="255" fill="#92400e">tests/</text>
    <text x="870" y="295" fill="#92400e">examples/</text>
    <text x="870" y="335" fill="#92400e">docs/</text>
    <text x="870" y="390" fill="#78350f" font-size="15">Reproducibility and traceability</text>
  </g>
